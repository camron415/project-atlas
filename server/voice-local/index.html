<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Atlas" />
  <meta name="theme-color" content="#121410" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon-180.png" />
  <title>Atlas</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #121410;
      --card: #1c1f18;
      --ink: #f4f1e8;
      --muted: #a8a394;
      --line: #34382e;
      --gold: #e2c56b;
      --hold: #c4553a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      font: 17px/1.45 "Iowan Old Style", Palatino, Georgia, serif;
    }
    main {
      max-width: 720px;
      min-height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding:
        calc(18px + env(safe-area-inset-top))
        20px
        calc(18px + env(safe-area-inset-bottom));
    }
    h1 { font-weight: 500; font-size: 28px; margin: 0 0 6px; }
    .sub, .status, .meta, summary { color: var(--muted); }
    .status { min-height: 1.4em; margin: 14px 0 8px; }
    button, textarea { font: inherit; }
    .hold {
      width: 100%;
      margin-top: auto;
      border: 0;
      border-radius: 22px;
      min-height: 88px;
      padding: 22px 16px;
      background: var(--gold);
      color: #1a160c;
      font-size: 24px;
      cursor: pointer;
    }
    .hold.live { background: var(--hold); color: white; }
    .hold:disabled { opacity: 0.45; cursor: wait; }
    .wide { width: 100%; margin-top: 10px; min-height: 44px; }
    .tools { display: flex; gap: 8px; margin-top: 10px; }
    .tools .ghost { flex: 1; min-height: 44px; }
    .settings { margin-top: 10px; }
    .settings > summary {
      list-style: none;
      cursor: pointer;
      color: var(--muted);
      font: 14px/1.3 -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 8px 0;
    }
    .settings > summary::-webkit-details-marker { display: none; }
    .settings[open] > summary { color: var(--ink); }
    .settings .prefs {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 4px;
    }
    .seg {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 6px 6px 7px;
    }
    .seg span {
      display: block;
      color: var(--muted);
      font: 12px/1.2 -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: 0.04em;
      text-align: center;
      margin-bottom: 6px;
    }
    .seg .pair { display: flex; gap: 4px; }
    .seg button {
      flex: 1;
      min-height: 36px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--ink);
      font: 14px/1 -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 6px 1px;
      cursor: pointer;
      white-space: nowrap;
    }
    .seg button.on { background: var(--gold); color: #1a160c; }
    .seg .triple { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; }
    .seg .triple button { font-size: 12px; padding: 6px 2px; }
    .pref-note { font-size: 13px; margin: 8px 0 0; min-height: 2.6em; }
    .manual-turn {
      display: none;
      margin-top: 10px;
      min-height: 52px;
      font-size: 18px;
      background: var(--card);
      border-color: var(--gold);
      color: var(--gold);
    }
    .manual-turn.on { background: var(--gold); color: #1a160c; border-color: transparent; }
    .manual-turn.show { display: block; }
    details { margin-top: 14px; }
    summary { cursor: pointer; }
    form { display: flex; gap: 8px; margin-top: 12px; }
    textarea {
      flex: 1;
      resize: vertical;
      min-height: 52px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      padding: 12px;
    }
    form button, .ghost {
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      padding: 0 16px;
      cursor: pointer;
    }
    .ghost.on { background: var(--hold); color: white; border-color: transparent; }
    .ghost.practice.on { background: var(--gold); color: #1a160c; }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    .log {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow: auto;
      max-height: 24dvh;
    }
    .bubble { background: var(--card); border-radius: 14px; padding: 12px 14px; }
    .bubble b { display: block; font-size: 13px; letter-spacing: 0.04em; color: var(--gold); font-weight: 600; }
    .bubble p { margin: 4px 0 0; }
    .bubble.live-you p { color: var(--muted); font-style: italic; }
    .status.speaking { cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
    .meta { font-size: 13px; margin: 8px 0 0; }
    .lock {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      background: #0e100c;
      text-align: center;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    .lock.on { display: flex; }
    .lock h2 { margin: 0; font-size: 22px; font-weight: 600; }
    .lock p { margin: 0; max-width: 26rem; color: var(--muted); }
    .holdbar {
      width: min(280px, 80vw);
      height: 8px;
      border-radius: 99px;
      background: var(--line);
      overflow: hidden;
    }
    .holdbar span { display: block; height: 100%; width: 0%; background: var(--gold); }
  </style>
</head>
<body>
  <main>
    <h1>Atlas</h1>
    <p class="status" id="status">Starting…</p>
    <div class="log" id="log"></div>
    <p class="meta" id="meta"></p>
    <button class="ghost manual-turn" id="manual-turn" type="button">Start turn</button>
    <button class="hold" id="call" disabled>Start call</button>
    <details class="settings">
      <summary>Call settings</summary>
      <div class="prefs">
        <div class="seg" role="group" aria-label="Brain">
          <span>Brain</span>
          <div class="pair">
            <button type="button" id="brain-grok">Grok</button>
            <button type="button" id="brain-plus">Plus</button>
            <button type="button" id="brain-flash">Flash</button>
          </div>
        </div>
        <div class="seg" role="group" aria-label="Voice">
          <span>Voice</span>
          <div class="pair">
            <button type="button" id="mouth-phonon">Phonon</button>
            <button type="button" id="mouth-kokoro">Kokoro</button>
          </div>
        </div>
        <div class="seg" role="group" aria-label="Who ends your turn">
          <span>Turn ends</span>
          <div class="triple">
            <button type="button" id="end-mac">Mac</button>
            <button type="button" id="end-phone">Phone</button>
            <button type="button" id="end-manual">Manual</button>
          </div>
        </div>
      </div>
      <p class="meta pref-note" id="pref-note"></p>
      <div class="tools">
        <button class="ghost practice" id="practice-1" type="button" title="Daniel 1–7 youth lesson">1</button>
        <button class="ghost" id="mute" type="button">Mute</button>
        <button class="ghost" id="phone" type="button">Phone voice</button>
      </div>
    </details>
    <details>
      <summary>Type instead</summary>
      <form id="typed">
        <textarea id="text" rows="2" placeholder="Or type a turn"></textarea>
        <button type="submit">Send</button>
      </form>
      <div class="row">
        <button class="ghost" id="hello" type="button">Hear a test line</button>
        <button class="ghost" id="clear" type="button">Clear</button>
      </div>
    </details>
  </main>
  <script>
    const statusEl = document.querySelector("#status");
    const callBtn = document.querySelector("#call");
    const log = document.querySelector("#log");
    const meta = document.querySelector("#meta");
    const form = document.querySelector("#typed");
    const text = document.querySelector("#text");
    const CHECK_MS = 420;
    const HOLD_MAX_MS = 3200;
    const SPEECH_RMS = 0.026;
    const SPEECH_KEEP = 0.018;
    const BARGE_FLOOR = 0.024;
    const BARGE_MS = 300;
    const PARTIAL_FIRST_MS = 400;
    const PARTIAL_GAP_MS = 900;
    const params = new URLSearchParams(location.search);
    if (params.get("k")) localStorage.setItem("atlas-gate", params.get("k"));
    const gateKey = params.get("k") || localStorage.getItem("atlas-gate") || "";

    let stream = null;
    let audioCtx = null;
    let analyser = null;
    let pcmChunks = [];
    let pcmSamples = 0;
    let busy = false;
    let ready = false;
    let callOn = false;
    let listening = false;
    let heardSpeech = false;
    let silenceMs = 0;
    let lastTick = 0;
    let playing = false;
    let currentSource = null;
    let epoch = 0;
    let wakeLock = null;
    let probeBusy = false;
    let probeAbort = null;
    let probeGen = 0;
    let bargeMs = 0;
    let nextProbeAt = CHECK_MS;
    let armedForce = false;
    let turnToken = 0;
    let abortTurn = null;
    let liveToken = 0;
    let liveYou = null;
    let partialBusy = false;
    let partialAt = 0;
    let partialsSent = 0;
    let playbackFloor = 0.02;
    let clipFloor = 0.02;
    let playGen = 0;
    let duplex = false;
    let replyEl = null;
    let nativePlay = null;
    let nativeBroken = false;
    const audioQueue = [];

    function setStatus(value) { statusEl.textContent = value; }

    let brainChoice = "plus";
    let mouthChoice = localStorage.getItem("atlas.mouth") === "kokoro" ? "kokoro" : "phonon";
    let phoneVoice = false;
    let endMode = localStorage.getItem("atlas.endMode") || "";
    if (!endMode) {
      endMode = localStorage.getItem("atlas.phoneEnds") === "1" ? "phone" : "mac";
    }
    let manualSegment = false;
    let captionCarry = "";
    let captionWindow = "";
    let brainStamp = 0;
    let practiceSlot = localStorage.getItem("atlas.practice") === "1" ? "1" : "";
    const prefNote = document.querySelector("#pref-note");
    const manualBtn = document.querySelector("#manual-turn");

    function brainName(name) {
      if (name === "flash" || name === "grok" || name === "plus") return name;
      return "plus";
    }

    function endName(mode) {
      if (mode === "mac" || mode === "phone" || mode === "manual") return mode;
      if (mode === true || mode === "true") return "phone";
      return "mac";
    }

    function captionWords(text) {
      return String(text || "").trim().split(/\s+/).filter(Boolean);
    }

    function captionJoin(parts) {
      return parts.map((p) => String(p || "").trim()).filter(Boolean).join(" ");
    }

    function captionKey(word) {
      return String(word).toLowerCase().replace(/[^a-z0-9']/g, "");
    }

    function expandCaption(prior, piece) {
      prior = String(prior || "").trim();
      piece = String(piece || "").trim();
      if (!prior) return piece;
      if (!piece) return prior;
      const priorWords = captionWords(prior);
      const pieceWords = captionWords(piece);
      const priorKeys = priorWords.map(captionKey);
      const pieceKeys = pieceWords.map(captionKey);
      let overlap = 0;
      for (let n = Math.min(priorKeys.length, pieceKeys.length); n > 0; n -= 1) {
        if (priorKeys.slice(-n).join("|") === pieceKeys.slice(0, n).join("|")) {
          overlap = n;
          break;
        }
      }
      const tail = pieceWords.slice(overlap);
      return tail.length ? captionJoin([prior, captionJoin(tail)]) : prior;
    }

    function paintPrefs() {
      document.querySelector("#brain-grok").classList.toggle("on", brainChoice === "grok");
      document.querySelector("#brain-plus").classList.toggle("on", brainChoice === "plus");
      document.querySelector("#brain-flash").classList.toggle("on", brainChoice === "flash");
      document.querySelector("#mouth-phonon").classList.toggle("on", mouthChoice === "phonon");
      document.querySelector("#mouth-kokoro").classList.toggle("on", mouthChoice === "kokoro");
      document.querySelector("#end-mac").classList.toggle("on", endMode === "mac");
      document.querySelector("#end-phone").classList.toggle("on", endMode === "phone");
      document.querySelector("#end-manual").classList.toggle("on", endMode === "manual");
      document.querySelector("#practice-1").classList.toggle("on", practiceSlot === "1");
      manualBtn.classList.toggle("show", callOn && endMode === "manual");
      manualBtn.classList.toggle("on", !!manualSegment);
      manualBtn.textContent = manualSegment ? "Send turn" : "Start turn";
      const voice = mouthChoice === "phonon"
        ? (phoneVoice ? "Phonon speaks on this phone." : "Phonon needs Phone voice on. The Mac still uses Kokoro.")
        : "Kokoro speaks.";
      const brain = brainChoice === "flash" ? "Flash answers." : brainChoice === "grok" ? "Grok answers." : "Plus answers.";
      const lesson = practiceSlot === "1" ? "Lesson 1: Daniel youth Sunday School (Plus). " : "";
      const end = endMode === "manual"
        ? "You start and send each turn with the button."
        : endMode === "phone"
          ? "A short quiet on the phone ends your turn."
          : "The Mac decides when you have finished.";
      prefNote.textContent = `${lesson}${voice} ${brain} ${end}`;
    }

    function enterManualIdle() {
      manualSegment = false;
      stopListen();
      pcmChunks = [];
      pcmSamples = 0;
      heardSpeech = false;
      silenceMs = 0;
      liveYou = null;
      if (callOn) setStatus("Tap Start turn when ready.");
      paintPrefs();
    }

    function resumeAfterTurn() {
      if (!callOn || playing || audioQueue.length) return;
      if (endMode === "manual" && !duplex) enterManualIdle();
      else armListen();
    }

    function toggleManualTurn() {
      if (!callOn || endMode !== "manual" || busy || playing) return;
      if (duplex || hasNative()) {
        if (!manualSegment) {
          tellNative("manual", { start: true });
          captionCarry = "";
          captionWindow = "";
          manualSegment = true;
          paintPrefs();
          setStatus("Recording… tap Send turn when done.");
        } else {
          tellNative("manual", { start: false });
        }
        return;
      }
      if (!manualSegment) {
        captionCarry = "";
        captionWindow = "";
        manualSegment = true;
        armListen();
        setStatus("Recording… tap Send turn when done.");
        paintPrefs();
        return;
      }
      if (!heardSpeech) {
        setStatus("Say something first, then tap Send turn.");
        return;
      }
      manualSegment = false;
      paintPrefs();
      considerEnd(true);
    }

    function rememberBrain() {
      fetch("/brain", withGate({
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: brainChoice }),
      })).catch(() => {});
    }

    function rememberPractice() {
      fetch("/practice", withGate({
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ slot: practiceSlot }),
      })).catch(() => {});
    }

    function rememberEnd() {
      fetch("/end-mode", withGate({
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mode: endMode || "mac" }),
      })).catch(() => {});
    }

    function withGate(init = {}) {
      const headers = new Headers(init.headers || {});
      if (gateKey) headers.set("X-Atlas-Gate", gateKey);
      headers.set("X-Atlas-Brain", brainChoice);
      headers.set("X-Atlas-End", endMode || "mac");
      if (practiceSlot) headers.set("X-Atlas-Practice", practiceSlot);
      return { ...init, headers };
    }

    function withTurn(init, token) {
      const next = withGate(init);
      if (token) next.headers.set("X-Atlas-Turn", String(token));
      return next;
    }

    function addBubble(who, body, extraClass = "") {
      const el = document.createElement("div");
      el.className = "bubble" + (extraClass ? ` ${extraClass}` : "");
      const title = document.createElement("b");
      title.textContent = who;
      const p = document.createElement("p");
      p.textContent = body;
      el.append(title, p);
      log.prepend(el);
      return p;
    }

    function holdCallSession() {
      if (navigator.audioSession) navigator.audioSession.type = "play-and-record";
      if (audioCtx && audioCtx.state !== "running") audioCtx.resume().catch(() => {});
    }

    function hasNative() {
      return !nativeBroken && !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.atlas);
    }

    function bridge() {
      return window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.atlas;
    }

    function tellNative(op, extra) {
      const prefs = op === "brain" || op === "end" || op === "manual";
      if (!hasNative() && !prefs && op !== "stop" && op !== "release") return;
      const link = bridge();
      if (!link) return;
      link.postMessage(Object.assign({ op }, extra || {}));
    }

    function releaseWebMic() {
      listening = false;
      if (stream) stream.getTracks().forEach((track) => track.stop());
      stream = null;
      analyser = null;
      if (audioCtx) audioCtx.close().catch(() => {});
      audioCtx = null;
    }

    function stopSpeaking() {
      playGen += 1;
      audioQueue.length = 0;
      if (currentSource) {
        try { currentSource.onended = null; currentSource.stop(); } catch { /* already stopped */ }
        currentSource = null;
      }
      nativePlay = null;
      tellNative("stop");
      playing = false;
    }

    function enqueueWav(b64) {
      audioQueue.push(b64);
      if (!playing) playNext();
    }

    function playNext() {
      const b64 = audioQueue.shift();
      if (!b64) {
        playing = false;
        statusEl.classList.remove("speaking");
        currentSource = null;
        tellNative("release");
        if (callOn && !busy) {
          ensureMic().then(() => {
            if (callOn && !busy && !playing) armListen();
          }).catch(() => setStatus("Tap Start call to allow the microphone."));
        } else if (!busy) setStatus(callOn ? "Listening…" : "Ready");
        return;
      }
      const gen = ++playGen;
      playing = true;
      clipFloor = playbackFloor;
      holdCallSession();
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      statusEl.classList.add("speaking");
      setStatus("Speaking… talk or tap to interrupt");
      playBuffer(bytes.buffer, gen).then((finished) => {
        if (finished && gen === playGen) playNext();
      });
    }

    function bytesToB64(bytes) {
      let binary = "";
      const step = 8192;
      for (let i = 0; i < bytes.length; i += step) {
        const slice = bytes.subarray(i, Math.min(i + step, bytes.length));
        const copy = new Array(slice.length);
        for (let j = 0; j < slice.length; j++) copy[j] = slice[j];
        binary += String.fromCharCode.apply(null, copy);
      }
      return btoa(binary);
    }

    function playNative(arrayBuffer, gen) {
      if (stream) releaseWebMic();
      const wav = bytesToB64(new Uint8Array(arrayBuffer));
      return new Promise((resolve) => {
        nativePlay = { gen, resolve, bytes: arrayBuffer };
        window.setTimeout(() => {
          if (!nativePlay || nativePlay.gen !== gen) return;
          tellNative("play", { wav });
        }, 180);
      });
    }

    window.atlasClipEnded = (why) => {
      const pending = nativePlay;
      if (!pending) return;
      nativePlay = null;
      if (why === "fail") {
        nativeBroken = true;
        ensureMic().then(() => playBuffer(pending.bytes, pending.gen).then(pending.resolve));
        return;
      }
      if (why === "barge") {
        pending.resolve(false);
        bargeIn();
        return;
      }
      pending.resolve(pending.gen === playGen);
    };

    function playBuffer(arrayBuffer, gen) {
      if (hasNative()) return playNative(arrayBuffer, gen);
      const ctx = audioCtx;
      if (!ctx) return Promise.resolve(false);
      return ctx.decodeAudioData(arrayBuffer.slice(0)).then((buffer) => new Promise((resolve) => {
        if (gen !== playGen) {
          resolve(false);
          return;
        }
        const source = ctx.createBufferSource();
        source.buffer = buffer;
        source.connect(ctx.destination);
        currentSource = source;
        source.onended = () => {
          if (currentSource === source) currentSource = null;
          resolve(true);
        };
        try { source.start(); }
        catch { resolve(false); }
      })).catch(() => false);
    }

    function bargeSignal(rms) {
      const floor = Math.max(BARGE_FLOOR, clipFloor, playbackFloor);
      return rms > floor * 1.8 + 0.012;
    }

    function wavFromPcm(maxSeconds) {
      const rate = audioCtx ? audioCtx.sampleRate : 48000;
      if (!pcmSamples || !rate) return null;
      let frames = pcmChunks;
      let count = pcmSamples;
      if (maxSeconds) {
        const need = Math.floor(rate * maxSeconds);
        frames = [];
        count = 0;
        for (let i = pcmChunks.length - 1; i >= 0 && count < need; i--) {
          frames.push(pcmChunks[i]);
          count += pcmChunks[i].length;
        }
        frames.reverse();
      }
      if (count < rate * 0.3) return null;
      const buffer = new ArrayBuffer(44 + count * 2);
      const view = new DataView(buffer);
      const write = (offset, text) => { for (let i = 0; i < text.length; i++) view.setUint8(offset + i, text.charCodeAt(i)); };
      write(0, "RIFF");
      view.setUint32(4, 36 + count * 2, true);
      write(8, "WAVE");
      write(12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, rate, true);
      view.setUint32(28, rate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      write(36, "data");
      view.setUint32(40, count * 2, true);
      let offset = 44;
      for (const frame of frames) {
        for (let i = 0; i < frame.length && offset < buffer.byteLength; i++) {
          const sample = Math.max(-1, Math.min(1, frame[i]));
          view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7fff, true);
          offset += 2;
        }
      }
      return new Blob([buffer], { type: "audio/wav" });
    }

    function notePcm(event) {
      if (!listening) return;
      const data = event.inputBuffer.getChannelData(0);
      pcmChunks.push(new Float32Array(data));
      pcmSamples += data.length;
      const cap = (audioCtx?.sampleRate || 48000) * (endMode === "manual" && manualSegment ? 300 : 90);
      while (pcmSamples > cap && pcmChunks.length > 1) pcmSamples -= pcmChunks.shift().length;
    }

    async function sendPartial() {
      if (!callOn || !listening || busy || playing || probeBusy || partialBusy || !heardSpeech) return;
      const partialWindow = endMode === "manual" && manualSegment ? 15 : 8;
      const blob = wavFromPcm(partialWindow);
      if (!blob) return;
      partialBusy = true;
      const body = new FormData();
      body.append("audio", blob, "hear.wav");
      try {
        const res = await fetch("/hear", withGate({ method: "POST", body }));
        if (!res.ok || !listening) return;
        const data = await res.json();
        if (data.busy || !data.text) return;
        if (!liveYou) liveYou = addBubble("You", "…", "live-you");
        let line = data.text;
        if (endMode === "manual" && manualSegment) {
          const prior = captionJoin([captionCarry, captionWindow]);
          line = expandCaption(prior, data.text);
          captionCarry = "";
          captionWindow = line;
        }
        liveYou.textContent = line;
        liveYou.closest(".bubble")?.classList.add("live-you");
      } catch { /* offline or server busy */ }
      finally { partialBusy = false; }
    }

    async function poll() {
      try {
        const res = await fetch("/health");
        const data = await res.json();
        if (!meta.textContent) meta.textContent = data.detail || "";
        if (data.ready) {
          ready = true;
          callBtn.disabled = false;
          if (!callOn && !busy) setStatus("Ready");
          if (!callOn && params.has("call")) {
            startCall().catch((err) => {
              callOn = false;
              callBtn.classList.remove("live");
              callBtn.textContent = "Start call";
              setStatus(err.message || "Tap Start call to allow the microphone.");
            });
          }
          return;
        }
        setStatus(data.detail || "Loading models…");
      } catch {
        setStatus("This Mac is not answering yet.");
      }
      setTimeout(poll, 1000);
    }

    async function readBody(res, token, you, reply) {
      if (!res.ok || !res.body) {
        setStatus("I lost that. Say it once more.");
        if (reply) reply.textContent = "";
        return;
      }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done || token !== turnToken) break;
        buffer += decoder.decode(value, { stream: true });
        const parts = buffer.split("\n\n");
        buffer = parts.pop() || "";
        for (const part of parts) handleEvent(part, you, reply);
      }
      if (token === turnToken && buffer.trim()) handleEvent(buffer, you, reply);
    }

    async function runTurn(body, label) {
      if (typeof body === "string" && endMode === "manual") {
        try {
          const payload = JSON.parse(body);
          payload.commit = "1";
          body = JSON.stringify(payload);
        } catch { /* leave the body as typed */ }
      }
      if (!ready) return;
      const token = ++turnToken;
      liveToken = token;
      const ctrl = new AbortController();
      abortTurn = ctrl;
      busy = true;
      holdCallSession();
      stopListen();
      setStatus("Thinking… tap here to interrupt");
      statusEl.classList.add("speaking");
      const you = liveYou || (label ? addBubble("You", label) : null);
      if (you && label) {
        you.textContent = label;
        you.closest(".bubble")?.classList.remove("live-you");
      }
      const reply = addBubble("Atlas", "");
      try {
        const init = withTurn({ method: "POST", signal: ctrl.signal }, token);
        if (typeof body === "string") {
          init.headers.set("Content-Type", "application/json");
          init.body = body;
        } else {
          init.body = body;
        }
        const res = await fetch("/turn", init);
        if (token !== turnToken || !callOn) return;
        await readBody(res, token, you, reply);
      } catch (err) {
        if (token === turnToken && !quietNet(err)) reply.textContent = err.message || String(err);
      } finally {
        if (token === turnToken) {
          busy = false;
          if (!playing && !audioQueue.length) {
            statusEl.classList.remove("speaking");
          }
          if (callOn && !playing && !audioQueue.length) resumeAfterTurn();
          else if (!callOn && !playing) setStatus("Ready");
        }
      }
    }

    function dropProbe(token) {
      probeGen += 1;
      if (probeAbort) probeAbort.abort();
      probeBusy = false;
      if (token) fetch("/cancel", withTurn({ method: "POST" }, token)).catch(() => {});
    }

    function quietNet(err) {
      const name = err && err.name || "";
      const msg = String((err && err.message) || err || "");
      return name === "AbortError" || /load failed|network|abort|cancel|disconnect/i.test(msg);
    }

    function bargeIn() {
      if (!callOn) return;
      const token = liveToken;
      turnToken += 1;
      epoch += 1;
      if (abortTurn) abortTurn.abort();
      if (probeAbort) probeAbort.abort();
      fetch("/cancel", withTurn({ method: "POST" }, token)).catch(() => {});
      stopListen();
      stopSpeaking();
      statusEl.classList.remove("speaking");
      busy = false;
      probeBusy = false;
      playing = false;
      bargeMs = 0;
      armedForce = false;
      nextProbeAt = CHECK_MS;
      const resume = () => {
        if (!callOn || playing) return;
        if (endMode === "manual" && !manualSegment) {
          enterManualIdle();
          return;
        }
        armListen();
        heardSpeech = true;
        silenceMs = 0;
        setStatus(manualSegment ? "Recording… tap Send turn when done." : "Listening…");
      };
      if (stream) resume();
      else ensureMic().then(resume).catch(() => setStatus("Tap Start call to allow the microphone."));
    }

    async function considerEnd(force) {
      if (!callOn || busy || !listening) return;
      if (!force && probeBusy) return;
      const blob = wavFromPcm();
      if (!blob) return;
      if (force && probeBusy) dropProbe(liveToken);
      const gen = ++probeGen;
      const token = ++turnToken;
      liveToken = token;
      const ctrl = new AbortController();
      if (force) {
        busy = true;
        stopListen();
        setStatus("Thinking…");
      } else {
        probeBusy = true;
        probeAbort = ctrl;
      }
      abortTurn = ctrl;
      const body = new FormData();
      body.append("audio", blob, "turn.wav");
      if (!force) body.append("probe", "1");
      if (force && endMode === "manual") body.append("commit", "1");
      let you = null;
      let reply = null;
      try {
        const res = await fetch("/turn", withTurn({ method: "POST", body, signal: ctrl.signal }, token));
        if (gen !== probeGen || !callOn) {
          fetch("/cancel", withTurn({ method: "POST" }, token)).catch(() => {});
          return;
        }
        if (!res.ok) {
          probeBusy = false;
          setStatus("I lost that. Say it once more.");
          return;
        }
        const ctype = res.headers.get("content-type") || "";
        if (!force && ctype.includes("json")) {
          await res.json();
          probeBusy = false;
          return;
        }
        probeBusy = false;
        busy = true;
        stopListen();
        setStatus("Thinking…");
        you = liveYou || addBubble("You", "…");
        if (liveYou) liveYou.closest(".bubble")?.classList.remove("live-you");
        reply = addBubble("Atlas", "");
        await readBody(res, token, you, reply);
      } catch (err) {
        probeBusy = false;
        if (quietNet(err) || token !== turnToken) return;
        if (!reply) reply = addBubble("Atlas", "");
        reply.textContent = err.message || String(err);
      } finally {
        if (token === turnToken) {
          busy = false;
          probeBusy = false;
          if (callOn && !playing && !audioQueue.length) resumeAfterTurn();
        }
      }
    }

    function handleEvent(part, you, reply) {
      let event = "message";
      const dataLines = [];
      for (const line of part.split("\n")) {
        if (line.startsWith("event:")) event = line.slice(6).trim();
        else if (line.startsWith("data:")) dataLines.push(line.slice(5).trim());
      }
      if (!dataLines.length) return;
      const data = JSON.parse(dataLines.join("\n"));
      if (event === "restart") {
        stopSpeaking();
        if (reply) reply.textContent = "";
        playing = false;
      }
      if (event === "status") setStatus(data.detail || data.stage || "Working…");
      if (event === "transcript" && you) {
        you.textContent = data.text || "(silence)";
        you.closest(".bubble")?.classList.remove("live-you");
      }
      if (event === "delta") reply.textContent += data.text || "";
      if (event === "audio" && data.wav_b64) enqueueWav(data.wav_b64);
      if (event === "done" && data.text) reply.textContent = data.text;
      if (event === "done" && data.timing) {
        const t = data.timing;
        meta.textContent = `Heard ${t.stt_ms || 0} ms · first words ${t.first_token_ms || 0} ms · first audio ${t.first_audio_ms || 0} ms`;
      }
      if (event === "error") reply.textContent = data.message || "Turn failed.";
    }

    async function holdWake() {
      try {
        if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request("screen");
      } catch { /* the screen may still sleep if iOS refuses */ }
    }

    function releaseWake() {
      if (wakeLock) wakeLock.release().catch(() => {});
      wakeLock = null;
    }

    async function ensureMic() {
      if (stream) return stream;
      if (navigator.audioSession) navigator.audioSession.type = "play-and-record";
      stream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
          channelCount: 1,
        },
      });
      audioCtx = new AudioContext();
      await audioCtx.resume();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      const mic = audioCtx.createMediaStreamSource(stream);
      mic.connect(analyser);
      const mute = audioCtx.createGain();
      mute.gain.value = 0;
      const capture = audioCtx.createScriptProcessor(4096, 1, 1);
      capture.onaudioprocess = notePcm;
      mic.connect(capture);
      capture.connect(mute);
      mute.connect(audioCtx.destination);
      holdCallSession();
      return stream;
    }

    function armListen() {
      if (!callOn || busy || playing || listening || !stream) return;
      pcmChunks = [];
      pcmSamples = 0;
      heardSpeech = false;
      silenceMs = 0;
      lastTick = 0;
      partialAt = 0;
      partialsSent = 0;
      liveYou = null;
      nextProbeAt = CHECK_MS;
      armedForce = false;
      listening = true;
      setStatus("Listening…");
    }

    function stopListen() {
      listening = false;
      heardSpeech = false;
    }

    function watch() {
      requestAnimationFrame(watch);
      if (!analyser || !callOn) return;
      if (playing || busy) holdCallSession();
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
      const data = new Uint8Array(analyser.fftSize);
      analyser.getByteTimeDomainData(data);
      let sum = 0;
      for (let i = 0; i < data.length; i++) {
        const x = (data[i] - 128) / 128;
        sum += x * x;
      }
      const rms = Math.sqrt(sum / data.length);
      const now = performance.now();
      const dt = lastTick ? now - lastTick : 16;
      lastTick = now;
      if (playing || busy) {
        playbackFloor = playbackFloor * 0.94 + rms * 0.06;
        if (bargeSignal(rms)) {
          bargeMs += dt;
          if (bargeMs >= BARGE_MS) bargeIn();
        } else {
          bargeMs = Math.max(0, bargeMs - dt * 0.5);
        }
        return;
      }
      if (!listening) return;
      if (endMode === "manual" && !manualSegment) return;
      const speaking = rms > (heardSpeech ? SPEECH_KEEP : SPEECH_RMS);
      if (speaking) {
        if (!heardSpeech) {
          setStatus("Hearing you…");
          if (!liveYou) liveYou = addBubble("You", "…", "live-you");
        }
        heardSpeech = true;
        silenceMs = 0;
        armedForce = false;
        nextProbeAt = CHECK_MS;
        bargeMs = 0;
        if (probeBusy) dropProbe(liveToken);
        if (!partialAt) partialAt = now;
        const wait = endMode === "manual" && manualSegment
          ? 1100
          : partialsSent === 0
            ? PARTIAL_FIRST_MS
            : PARTIAL_GAP_MS;
        if (!partialBusy && now - partialAt >= wait) {
          partialAt = now;
          partialsSent += 1;
          sendPartial();
        }
      } else if (heardSpeech) {
        if (silenceMs === 0 && !partialBusy && (partialsSent === 0 || now - partialAt > 500)) {
          partialAt = now;
          partialsSent += 1;
          sendPartial();
        }
        silenceMs += dt;
        if (endMode === "manual") return;
        if (endMode === "phone") {
          if (!armedForce && silenceMs >= 850) {
            armedForce = true;
            considerEnd(true);
          }
          return;
        }
        if (!armedForce && silenceMs >= HOLD_MAX_MS) {
          armedForce = true;
          considerEnd(true);
        } else if (!probeBusy && silenceMs >= nextProbeAt && silenceMs < HOLD_MAX_MS) {
          nextProbeAt = silenceMs + 500;
          considerEnd(false);
        }
      }
    }

    function playClip(url) {
      const gen = ++playGen;
      playing = true;
      statusEl.classList.add("speaking");
      setStatus("Speaking… tap here to interrupt");
      holdCallSession();
      return fetch(url, withGate({})).then(async (res) => {
        if (!res.ok) throw new Error("Greeting did not load.");
        await playBuffer(await res.arrayBuffer(), gen);
        if (gen === playGen) {
          playing = false;
          statusEl.classList.remove("speaking");
        }
      });
    }

    async function startCall() {
      callOn = true;
      callBtn.classList.add("live");
      callBtn.textContent = "End call";
      paintPrefs();
      await holdWake();
      if (hasNative()) {
        duplex = true;
        tellNative("arm");
        return;
      }
      duplex = false;
      await startWebCall();
    }

    async function startWebCall() {
      await ensureMic();
      const unlock = audioCtx.createBuffer(1, 1, 22050);
      const source = audioCtx.createBufferSource();
      source.buffer = unlock;
      source.connect(audioCtx.destination);
      source.start();
      await playClip("/greeting");
      tellNative("release");
      if (callOn && !busy) {
        await ensureMic();
        if (callOn && !busy && !playing) resumeAfterTurn();
      }
    }

    function endCall() {
      const token = liveToken;
      turnToken += 1;
      epoch += 1;
      callOn = false;
      busy = false;
      probeBusy = false;
      if (duplex) {
        duplex = false;
        tellNative("disarm");
      }
      window.atlasMuted(false);
      if (abortTurn) abortTurn.abort();
      if (probeAbort) probeAbort.abort();
      fetch("/cancel", withTurn({ method: "POST" }, token)).catch(() => {});
      callBtn.classList.remove("live");
      callBtn.textContent = "Start call";
      stopListen();
      stopSpeaking();
      statusEl.classList.remove("speaking");
      releaseWake();
      manualSegment = false;
      paintPrefs();
      setStatus("Ready");
    }

    statusEl.addEventListener("click", () => {
      if (duplex) {
        if (callOn) tellNative("barge");
        return;
      }
      if (callOn && (playing || busy)) bargeIn();
    });

    const muteBtn = document.querySelector("#mute");
    muteBtn.addEventListener("click", () => {
      if (!callOn || !hasNative()) {
        setStatus("Start the call, then mute.");
        return;
      }
      tellNative("mute");
    });
    window.atlasMuted = (on) => {
      muteBtn.textContent = on ? "Muted" : "Mute";
      muteBtn.classList.toggle("on", !!on);
    };

    const phoneBtn = document.querySelector("#phone");
    phoneBtn.addEventListener("click", () => {
      if (!hasNative()) {
        setStatus("Open this in the Atlas app.");
        return;
      }
      tellNative("phone");
    });
    window.atlasPhone = (on) => {
      phoneVoice = !!on;
      phoneBtn.textContent = on ? "Phone voice on" : "Phone voice";
      phoneBtn.classList.toggle("on", !!on);
      paintPrefs();
    };
    function chooseMouth(next) {
      mouthChoice = next === "kokoro" ? "kokoro" : "phonon";
      localStorage.setItem("atlas.mouth", mouthChoice);
      paintPrefs();
      if (bridge()) tellNative("mouth", { name: mouthChoice });
    }

    function chooseBrain(next) {
      brainChoice = brainName(next);
      brainStamp = Date.now();
      paintPrefs();
      rememberBrain();
      if (bridge()) tellNative("brain", { name: brainChoice });
    }
    function togglePractice1() {
      if (practiceSlot === "1") {
        practiceSlot = "";
        localStorage.removeItem("atlas.practice");
      } else {
        practiceSlot = "1";
        localStorage.setItem("atlas.practice", "1");
        brainChoice = "plus";
        brainStamp = Date.now();
        rememberBrain();
        if (bridge()) tellNative("brain", { name: "plus" });
      }
      paintPrefs();
      rememberPractice();
      if (practiceSlot === "1") setStatus("Daniel lesson tutor on. Plus for this call.");
      else if (!callOn) setStatus("Ready");
    }
    function chooseEnd(mode) {
      endMode = endName(mode);
      localStorage.setItem("atlas.endMode", endMode);
      paintPrefs();
      rememberEnd();
      tellNative("end", { mode: endMode });
      if (!callOn || duplex) return;
      if (endMode === "manual") enterManualIdle();
      else manualSegment = false;
    }
    document.querySelector("#practice-1").addEventListener("click", () => togglePractice1());
    document.querySelector("#brain-grok").addEventListener("click", () => chooseBrain("grok"));
    document.querySelector("#brain-plus").addEventListener("click", () => chooseBrain("plus"));
    document.querySelector("#brain-flash").addEventListener("click", () => chooseBrain("flash"));
    document.querySelector("#mouth-phonon").addEventListener("click", () => chooseMouth("phonon"));
    document.querySelector("#mouth-kokoro").addEventListener("click", () => chooseMouth("kokoro"));
    window.atlasMouth = (name) => {
      mouthChoice = name === "kokoro" ? "kokoro" : "phonon";
      localStorage.setItem("atlas.mouth", mouthChoice);
      paintPrefs();
    };
    document.querySelector("#end-mac").addEventListener("click", () => chooseEnd("mac"));
    document.querySelector("#end-phone").addEventListener("click", () => chooseEnd("phone"));
    document.querySelector("#end-manual").addEventListener("click", () => chooseEnd("manual"));
    manualBtn.addEventListener("click", () => toggleManualTurn());
    window.atlasBrain = (name) => {
      const echoed = brainName(name);
      if (brainChoice === "flash" && echoed !== "flash" && Date.now() - brainStamp < 1500) {
        paintPrefs();
        rememberBrain();
        return;
      }
      brainChoice = echoed;
      paintPrefs();
      rememberBrain();
    };
    window.atlasEnd = (mode) => {
      const next = typeof mode === "boolean" ? (mode ? "phone" : "mac") : endName(mode);
      if (localStorage.getItem("atlas.endMode") === "manual" && next !== "manual") {
        tellNative("end", { mode: "manual" });
        return;
      }
      endMode = next;
      localStorage.setItem("atlas.endMode", endMode);
      paintPrefs();
      rememberEnd();
      if (callOn && endMode === "manual" && !duplex) enterManualIdle();
    };
    window.atlasManual = (on) => {
      manualSegment = !!on;
      paintPrefs();
      if (manualSegment) setStatus("Recording… tap Send turn when done.");
      else if (callOn && endMode === "manual") setStatus("Tap Start turn when ready.");
    };
    paintPrefs();
    rememberEnd();
    tellNative("end", { mode: endMode || "mac" });
    if (practiceSlot === "1") rememberPractice();

    callBtn.addEventListener("click", () => {
      if (!ready) return;
      if (callOn) endCall();
      else startCall().catch((err) => {
        callOn = false;
        callBtn.classList.remove("live");
        callBtn.textContent = "Start call";
        setStatus(err.message || "Tap Start call to allow the microphone.");
      });
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && callOn) holdWake();
    });

    form.addEventListener("submit", (ev) => {
      ev.preventDefault();
      const value = text.value.trim();
      if (!value || busy) return;
      text.value = "";
      if (duplex) {
        tellNative("text", { text: value });
        return;
      }
      runTurn(JSON.stringify({ text: value }), value);
    });

    document.querySelector("#hello").addEventListener("click", () => {
      if (busy) return;
      if (duplex) {
        tellNative("text", { text: "Say hello in one friendly sentence and confirm you can hear me on a call." });
        return;
      }
      runTurn(JSON.stringify({ text: "Say hello in one friendly sentence and confirm you can hear me on a call." }), "Say hello.");
    });
    document.querySelector("#clear").addEventListener("click", async () => {
      await fetch("/clear", withGate({ method: "POST" }));
      log.replaceChildren();
      replyEl = null;
      liveYou = null;
      if (!callOn) setStatus("Ready");
    });

    window.atlasStatus = (text) => setStatus(text);
    window.atlasPhase = (phase) => {
      playing = phase === "speaking";
      busy = phase === "thinking" || phase === "speaking";
      statusEl.classList.toggle("speaking", busy);
    };
    window.atlasYou = (text, live) => {
      if (!liveYou) liveYou = addBubble("You", text, live ? "live-you" : "");
      else liveYou.textContent = text;
      liveYou.closest(".bubble")?.classList.toggle("live-you", !!live);
      if (!live) liveYou = null;
    };
    window.atlasReply = (text, mode) => {
      if (mode === "open" || !replyEl) replyEl = addBubble("Atlas", "");
      if (mode === "add" && replyEl) replyEl.textContent += text;
      else if (mode === "close" && replyEl) {
        if (text) replyEl.textContent = text;
        replyEl = null;
      } else if (replyEl) replyEl.textContent = text;
    };
    window.atlasRestart = () => { if (replyEl) replyEl.textContent = ""; };
    window.atlasMeta = (text) => { meta.textContent = text; };
    window.atlasFail = () => {
      duplex = false;
      if (!callOn) return;
      startWebCall().catch((err) => {
        callOn = false;
        callBtn.classList.remove("live");
        callBtn.textContent = "Start call";
        setStatus(err.message || "Tap Start call to allow the microphone.");
      });
    };

    watch();
    poll();
  </script>
</body>
</html>
